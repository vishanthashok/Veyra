# Local development stack. Synthetic data only until the SECURITY.md items are closed.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veyra}
      POSTGRES_DB: veyra
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      VEYRA_DATABASE_URL: postgresql+psycopg://veyra:${POSTGRES_PASSWORD:-veyra}@db:5432/veyra
      VEYRA_SECRET_KEY: ${VEYRA_SECRET_KEY:-dev-only-change-me}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["./demo:/demo:ro"]

  web:
    build:
      context: ./frontend
      args:
        VEYRA_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
